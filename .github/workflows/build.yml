name: Build MCBot LoadTest JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 构建项目
        run: mvn clean package --batch-mode

      - name: 上传构建产物 (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: MCBot-LoadTest
          path: target/MCBot-LoadTest.jar
          retention-days: 7
